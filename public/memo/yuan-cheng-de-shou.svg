<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="24" fill="url(#bg)"/>

  <!-- 云端：小木 -->
  <rect x="60" y="140" width="200" height="140" rx="20" fill="url(#amber)"/>
  <text x="160" y="195" text-anchor="middle" font-size="22" font-weight="bold" fill="#1c1917">云端</text>
  <text x="160" y="230" text-anchor="middle" font-size="16" fill="#451a03">小木</text>
  <text x="160" y="256" text-anchor="middle" font-size="13" fill="#78350f">指挥者</text>

  <!-- 中间链路 -->
  <line x1="260" y1="210" x2="380" y2="210" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="380,210 366,202 366,218" fill="#fbbf24"/>
  <text x="320" y="190" text-anchor="middle" font-size="14" fill="#fde68a">node exec</text>
  <text x="320" y="245" text-anchor="middle" font-size="13" fill="#a8a29e">远程指令</text>

  <!-- 博主电脑 -->
  <g transform="translate(430, 60)">
    <!-- 显示器 -->
    <rect x="0" y="0" width="320" height="210" rx="14" fill="#44403c" stroke="#78716c" stroke-width="3"/>
    <rect x="12" y="12" width="296" height="186" rx="8" fill="#0c0a09"/>
    <!-- 浏览器窗口 -->
    <rect x="24" y="24" width="272" height="150" rx="8" fill="#1c1917" stroke="#57534e"/>
    <circle cx="40" cy="38" r="5" fill="#f87171"/>
    <circle cx="56" cy="38" r="5" fill="#fbbf24"/>
    <circle cx="72" cy="38" r="5" fill="#4ade80"/>
    <rect x="90" y="30" width="140" height="16" rx="8" fill="#292524"/>
    <text x="160" y="42" text-anchor="middle" font-size="11" fill="#a8a29e">jobs.bilibili.com</text>
    <rect x="36" y="56" width="248" height="10" rx="5" fill="#292524"/>
    <rect x="36" y="76" width="210" height="10" rx="5" fill="#292524"/>
    <rect x="36" y="96" width="230" height="10" rx="5" fill="#292524"/>
    <rect x="36" y="116" width="180" height="10" rx="5" fill="#292524"/>
    <rect x="36" y="136" width="140" height="22" rx="6" fill="url(#amber)"/>
    <text x="106" y="151" text-anchor="middle" font-size="11" fill="#451a03">提交</text>
    <!-- 底座 -->
    <rect x="120" y="216" width="80" height="14" rx="4" fill="#57534e"/>
    <rect x="40" y="230" width="240" height="10" rx="5" fill="#44403c"/>
  </g>
  <text x="590" y="330" text-anchor="middle" font-size="15" fill="#e7e5e4">博主的电脑</text>
  <text x="590" y="352" text-anchor="middle" font-size="12" fill="#a8a29e">Edge 浏览器 · 小辛节点</text>

  <!-- 底部连接线回传 -->
  <line x1="590" y1="358" x2="160" y2="350" stroke="#78716c" stroke-width="2" stroke-dasharray="4 6"/>
  <polygon points="160,350 174,344 174,356" fill="#78716c"/>
  <text x="375" y="385" text-anchor="middle" font-size="13" fill="#d6d3d1">表单进度 / 截图回传</text>
</svg>
