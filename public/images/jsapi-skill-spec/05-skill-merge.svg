<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Inter', 'PingFang SC', sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
  </defs>

  <rect width="900" height="320" fill="#F8FAFC" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">Skill 合并优化：减少碎片，提升内聚</text>

  <!-- Merge 1: doc -->
  <text x="120" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748B">合并前</text>
  <text x="350" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">合并后</text>

  <rect x="20" y="90" width="200" height="40" rx="6" fill="#FEF2F2" stroke="#FCA5A5" filter="url(#s)"/>
  <text x="120" y="115" text-anchor="middle" font-size="12" fill="#991B1B">jsapi-doc-extractor</text>
  <text x="120" y="135" text-anchor="middle" font-size="9" fill="#EF4444">文档提取</text>

  <rect x="20" y="150" width="200" height="40" rx="6" fill="#FEF2F2" stroke="#FCA5A5" filter="url(#s)"/>
  <text x="120" y="175" text-anchor="middle" font-size="12" fill="#991B1B">doc-validator</text>
  <text x="120" y="195" text-anchor="middle" font-size="9" fill="#EF4444">文档校验</text>

  <line x1="225" y1="140" x2="280" y2="140" stroke="#EF4444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="225" y1="170" x2="280" y2="170" stroke="#EF4444" stroke-width="2" marker-end="url(#a)"/>

  <rect x="285" y="120" width="200" height="50" rx="8" fill="#D1FAE5" stroke="#34D399" stroke-width="2" filter="url(#s)"/>
  <text x="385" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">doc-validator</text>
  <text x="385" y="163" text-anchor="middle" font-size="9" fill="#059669">文档校验（合并后）</text>

  <text x="385" y="195" text-anchor="middle" font-size="10" fill="#64748B">原因：文档由人工编写，核心工作就是校验</text>

  <!-- Merge 2: feedback -->
  <text x="620" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748B">合并前</text>
  <text x="850" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">合并后</text>

  <rect x="520" y="90" width="200" height="40" rx="6" fill="#FEF2F2" stroke="#FCA5A5" filter="url(#s)"/>
  <text x="620" y="115" text-anchor="middle" font-size="12" fill="#991B1B">test-report-parser</text>
  <text x="620" y="135" text-anchor="middle" font-size="9" fill="#EF4444">报告解析</text>

  <rect x="520" y="150" width="200" height="40" rx="6" fill="#FEF2F2" stroke="#FCA5A5" filter="url(#s)"/>
  <text x="620" y="175" text-anchor="middle" font-size="12" fill="#991B1B">usecase-fixer</text>
  <text x="620" y="195" text-anchor="middle" font-size="9" fill="#EF4444">用例修正</text>

  <line x1="725" y1="140" x2="780" y2="140" stroke="#EF4444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="725" y1="170" x2="780" y2="170" stroke="#EF4444" stroke-width="2" marker-end="url(#a)"/>

  <rect x="785" y="120" width="200" height="50" rx="8" fill="#D1FAE5" stroke="#34D399" stroke-width="2" filter="url(#s)"/>
  <text x="885" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#065F46">usecase-calibrator</text>
  <text x="885" y="163" text-anchor="middle" font-size="9" fill="#059669">反馈校准（合并后）</text>

  <text x="885" y="195" text-anchor="middle" font-size="10" fill="#64748B">原因：解析和校准是连续动作，无需拆分</text>

  <!-- Bottom summary -->
  <rect x="70" y="255" width="760" height="45" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="450" y="275" text-anchor="middle" font-size="13" fill="#64748B">✅ 合并后项目级 Skill 从 8 个收缩为 6 个，能力不减、调度更简洁</text>
  <text x="450" y="293" text-anchor="middle" font-size="11" fill="#94A3B8">同质能力聚合，边界更清晰，维护成本更低</text>
</svg>