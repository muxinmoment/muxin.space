<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="'Inter', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="gL0" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="gL1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="gL2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/></marker>
    <marker id="arroww" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#BFDBFE"/></marker>
  </defs>

  <rect width="900" height="660" fill="#F8FAFC" rx="12"/>

  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E293B">JSAPI Skill 分层架构：三维模型全景（v2）</text>
  <text x="450" y="55" text-anchor="middle" font-size="13" fill="#64748B">纵向三级作用域 × 横向五大流程分类 × 双维度等级管控 | 6 个已实现 Skill</text>

  <!-- L0 -->
  <rect x="60" y="75" width="780" height="75" rx="10" fill="url(#gL0)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="105" font-size="16" font-weight="bold" fill="#DDD6FE">L0 全局级</text>
  <text x="220" y="105" font-size="13" fill="#C4B5FD">~/.config/opencode/skills/</text>
  <text x="620" y="105" font-size="12" fill="#C4B5FD" text-anchor="end">跨项目通用 · 1-3 个 Skill</text>
  <rect x="90" y="116" width="180" height="26" rx="6" fill="#A78BFA" opacity="0.7"/>
  <text x="100" y="134" font-size="12" fill="white">lingxi-miner（含 scripts + assets）</text>

  <line x1="450" y1="152" x2="450" y2="172" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="167" font-size="11" fill="#6B7280">继承</text>

  <!-- L1 -->
  <rect x="60" y="178" width="780" height="305" rx="10" fill="url(#gL1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="206" font-size="16" font-weight="bold" fill="#BFDBFE">L1 项目级</text>
  <text x="220" y="206" font-size="13" fill="#93C5FD">仓库根目录 .opencode/skills/（6 个 Skill，已全部实现）</text>

  <!-- Workflow -->
  <rect x="85" y="222" width="136" height="115" rx="8" fill="white" opacity="0.18"/>
  <rect x="85" y="222" width="136" height="28" rx="8" fill="#DC2626" opacity="0.9"/>
  <text x="153" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🔀 workflow</text>
  <text x="153" y="282" text-anchor="middle" font-size="12" fill="#BFDBFE">全流程编排 ✅</text>
  <text x="153" y="298" text-anchor="middle" font-size="11" fill="#93C5FD">full-pipeline</text>
  <text x="153" y="314" text-anchor="middle" font-size="9" fill="#60A5FA">5 阶段 · 并行 subagent</text>
  <text x="153" y="328" text-anchor="middle" font-size="9" fill="#60A5FA">审批机制</text>

  <!-- Doc -->
  <rect x="235" y="222" width="136" height="115" rx="8" fill="white" opacity="0.18"/>
  <rect x="235" y="222" width="136" height="28" rx="8" fill="#EA580C" opacity="0.9"/>
  <text x="303" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📋 doc</text>
  <text x="303" y="282" text-anchor="middle" font-size="12" fill="#BFDBFE">文档校验 ✅</text>
  <text x="303" y="298" text-anchor="middle" font-size="11" fill="#93C5FD">doc-validator</text>
  <text x="303" y="314" text-anchor="middle" font-size="9" fill="#60A5FA">预提取缓存</text>
  <text x="303" y="328" text-anchor="middle" font-size="9" fill="#60A5FA">12 refs · 5 scripts</text>

  <!-- Usecase -->
  <rect x="385" y="222" width="136" height="115" rx="8" fill="white" opacity="0.18"/>
  <rect x="385" y="222" width="136" height="28" rx="8" fill="#CA8A04" opacity="0.9"/>
  <text x="453" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🧪 usecase</text>
  <text x="453" y="282" text-anchor="middle" font-size="12" fill="#BFDBFE">用例生成 ✅</text>
  <text x="453" y="298" text-anchor="middle" font-size="11" fill="#93C5FD">usecase-generator</text>
  <text x="453" y="314" text-anchor="middle" font-size="9" fill="#60A5FA">8 条核心原则</text>
  <text x="453" y="328" text-anchor="middle" font-size="9" fill="#60A5FA">批量模式 · 6 refs</text>

  <!-- Execution -->
  <rect x="535" y="222" width="136" height="115" rx="8" fill="white" opacity="0.18"/>
  <rect x="535" y="222" width="136" height="28" rx="8" fill="#059669" opacity="0.9"/>
  <text x="603" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚡ execution</text>
  <text x="603" y="278" text-anchor="middle" font-size="12" fill="#BFDBFE">测试执行报告</text>
  <text x="603" y="298" text-anchor="middle" font-size="11" fill="#93C5FD" font-weight="bold">coverage-analyzer ✅</text>
  <text x="603" y="314" text-anchor="middle" font-size="9" fill="#6EE7B7">覆盖率统计 · 4 refs</text>
  <text x="603" y="328" text-anchor="middle" font-size="9" fill="#60A5FA">testkit-runner 🔜</text>

  <!-- Feedback -->
  <rect x="685" y="222" width="136" height="115" rx="8" fill="white" opacity="0.18"/>
  <rect x="685" y="222" width="136" height="28" rx="8" fill="#7C3AED" opacity="0.9"/>
  <text x="753" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🔄 feedback</text>
  <text x="753" y="282" text-anchor="middle" font-size="12" fill="#BFDBFE">反馈校准 ✅</text>
  <text x="753" y="298" text-anchor="middle" font-size="11" fill="#93C5FD">usecase-calibrator</text>
  <text x="753" y="314" text-anchor="middle" font-size="9" fill="#60A5FA">4 阶段双通道</text>
  <text x="753" y="328" text-anchor="middle" font-size="9" fill="#60A5FA">pending 消除</text>

  <!-- Process flow arrows -->
  <line x1="268" y1="340" x2="268" y2="352" stroke="#BFDBFE" stroke-width="2" marker-end="url(#arroww)"/>
  <line x1="343" y1="340" x2="343" y2="352" stroke="#BFDBFE" stroke-width="2" marker-end="url(#arroww)"/>
  <line x1="418" y1="340" x2="418" y2="352" stroke="#BFDBFE" stroke-width="2" marker-end="url(#arroww)"/>
  <line x1="493" y1="340" x2="493" y2="352" stroke="#BFDBFE" stroke-width="2" marker-end="url(#arroww)"/>
  <line x1="568" y1="340" x2="568" y2="352" stroke="#BFDBFE" stroke-width="2" marker-end="url(#arroww)"/>

  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#93C5FD">workflow 调度全链路 →</text>

  <!-- Feedback loop arrows -->
  <path d="M 603,342 L 603,360 L 753,360 L 753,342" fill="none" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arroww)"/>
  <text x="678" y="376" text-anchor="middle" font-size="9" fill="#C4B5FD">反馈闭环</text>

  <line x1="450" y1="485" x2="450" y2="505" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L2 -->
  <rect x="60" y="510" width="780" height="50" rx="10" fill="url(#gL2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="533" font-size="16" font-weight="bold" fill="#A7F3D0">L2 包级</text>
  <text x="220" y="533" font-size="13" fill="#6EE7B7">子包目录 .opencode/skills/ · 单包专属 · 0-3 个</text>
  <text x="620" y="533" font-size="12" fill="#6EE7B7" text-anchor="end">同名覆盖：包级 > 项目级 > 全局级</text>

  <!-- Grade controls -->
  <rect x="60" y="575" width="780" height="70" rx="10" fill="#1E293B" opacity="0.92"/>
  <text x="85" y="600" font-size="13" font-weight="bold" fill="#FBBF24">双维度等级管控：</text>
  <rect x="250" y="588" width="130" height="22" rx="5" fill="#FBBF24" opacity="0.15"/>
  <text x="315" y="604" text-anchor="middle" font-size="11" fill="#FCD34D">P0-P3 成熟度分级</text>
  <rect x="400" y="588" width="180" height="22" rx="5" fill="#FBBF24" opacity="0.15"/>
  <text x="490" y="604" text-anchor="middle" font-size="11" fill="#FCD34D">Tier1-Tier4 安全等级</text>
  <text x="615" y="604" font-size="11" fill="#9CA3AF">Tier2 新增"调度编排级"专为 full-pipeline</text>

  <text x="85" y="632" font-size="11" fill="#6B7280">P0（核心）：doc-validator | P1（关键）：usecase-generator · full-pipeline · coverage-analyzer | P2（效率）：usecase-calibrator · testkit-runner</text>
</svg>