<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Consolas', 'Monaco', 'JetBrains Mono', monospace">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="700" height="480" fill="#1E293B" rx="12"/>
  <text x="350" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#F1F5F9">单 Skill 目录结构标准</text>

  <!-- File tree -->
  <text x="40" y="70" font-size="14" fill="#94A3B8">┌─ .opencode/skills/</text>
  <text x="48" y="95" font-size="14" fill="#94A3B8">│</text>
  <text x="48" y="118" font-size="14" fill="#94A3B8">├─ 📂 workflow/</text>
  <text x="56" y="140" font-size="14" fill="#94A3B8">│  └─ 📂 full-pipeline/</text>
  <text x="64" y="162" font-size="14" fill="#94A3B8">│     └─ 📄 SKILL.md</text>
  <text x="48" y="184" font-size="14" fill="#94A3B8">├─ 📂 doc/</text>
  <text x="56" y="206" font-size="14" fill="#94A3B8">│  └─ 📂 doc-validator/</text>
  <text x="65" y="228" font-size="14" fill="#3B82F6" font-weight="bold">│     ├─ 📄 SKILL.md        ← 唯一入口</text>

  <!-- Highlight box -->
  <rect x="60" y="240" width="620" height="100" rx="6" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1"/>
  <text x="75" y="262" font-size="13" fill="#BFDBFE">🔹 SKILL.md  (必需)</text>
  <text x="415" y="262" font-size="11" fill="#60A5FA">单文件含 YAML frontmatter + 核心工作流</text>

  <text x="75" y="284" font-size="13" fill="#BFDBFE">🔹 INDEX.md  (推荐，references ≥ 3 时必加)</text>
  <text x="415" y="284" font-size="11" fill="#60A5FA">参考资源索引，需在 SKILL.md 中显式引用</text>

  <text x="75" y="306" font-size="13" fill="#BFDBFE">📦 assets/  (可选)</text>
  <text x="415" y="306" font-size="11" fill="#60A5FA">静态模板、配置、Schema 文件</text>

  <text x="75" y="328" font-size="13" fill="#BFDBFE">📚 references/  (可选)</text>
  <text x="415" y="328" font-size="11" fill="#60A5FA">详细规则、示例文档、踩坑记录</text>

  <text x="65" y="358" font-size="14" fill="#3B82F6">│     └─ ⚙️ scripts/  (可选)</text>
  <text x="48" y="380" font-size="14" fill="#94A3B8">├─ 📂 usecase/</text>
  <text x="48" y="402" font-size="14" fill="#94A3B8">├─ 📂 execution/</text>
  <text x="48" y="424" font-size="14" fill="#94A3B8">└─ 📂 feedback/</text>

  <!-- Top note -->
  <text x="350" y="458" text-anchor="middle" font-size="11" fill="#64748B">⚠️ INDEX.md / references / scripts / assets 不会被自动加载，必须在 SKILL.md 中显式引用路径</text>
</svg>