<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Inter', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F9FF"/><stop offset="100%" stop-color="#E0E7FF"/></linearGradient>
    <linearGradient id="fbGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FAF5FF"/><stop offset="100%" stop-color="#EDE9FE"/></linearGradient>
    <linearGradient id="caGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0FFF4"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B5CF6"/></marker>
  </defs>

  <rect width="900" height="450" fill="#F8FAFC" rx="12"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">核心数据流：与项目流程完全对齐（含覆盖率分析）</text>

  <!-- Input -->
  <rect x="30" y="175" width="120" height="55" rx="10" fill="#1E293B" filter="url(#s)"/>
  <text x="90" y="198" text-anchor="middle" font-size="11" fill="#94A3B8">源码</text>
  <text x="90" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="white">四端源码</text>

  <!-- Doc -->
  <rect x="175" y="55" width="130" height="110" rx="10" fill="url(#boxGrad)" stroke="#EA580C" stroke-width="2" filter="url(#s)"/>
  <rect x="175" y="55" width="130" height="28" rx="10" fill="#EA580C"/>
  <text x="240" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📋 doc</text>
  <text x="240" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">文档校验</text>
  <text x="240" y="120" text-anchor="middle" font-size="10" fill="#64748B">doc-validator</text>
  <text x="240" y="136" text-anchor="middle" font-size="9" fill="#94A3B8">预提取缓存</text>
  <text x="240" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">12 refs · 5 scripts</text>

  <line x1="150" y1="202" x2="175" y2="202" stroke="#3B82F6" stroke-width="2" marker-end="url(#a)"/>

  <!-- Usecase -->
  <rect x="330" y="55" width="130" height="110" rx="10" fill="url(#boxGrad)" stroke="#CA8A04" stroke-width="2" filter="url(#s)"/>
  <rect x="330" y="55" width="130" height="28" rx="10" fill="#CA8A04"/>
  <text x="395" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🧪 usecase</text>
  <text x="395" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">用例生成</text>
  <text x="395" y="120" text-anchor="middle" font-size="10" fill="#64748B">usecase-generator</text>
  <text x="395" y="136" text-anchor="middle" font-size="9" fill="#94A3B8">8 条原则 · 批量模式</text>
  <text x="395" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">6 refs</text>

  <line x1="305" y1="155" x2="330" y2="110" stroke="#3B82F6" stroke-width="2" marker-end="url(#a)"/>
  <text x="317" y="130" font-size="8" fill="#64748B" text-anchor="middle">api_docs</text>

  <!-- Coverage Analyzer (NEW!) -->
  <rect x="485" y="55" width="140" height="110" rx="10" fill="url(#caGrad)" stroke="#059669" stroke-width="2.5" filter="url(#s)"/>
  <rect x="485" y="55" width="140" height="28" rx="10" fill="#059669"/>
  <text x="555" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📊 coverage</text>
  <text x="555" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">覆盖率分析 ✨</text>
  <text x="555" y="120" text-anchor="middle" font-size="10" fill="#047857">coverage-analyzer</text>
  <text x="555" y="136" text-anchor="middle" font-size="9" fill="#059669">逐 API 场景检测</text>
  <text x="555" y="152" text-anchor="middle" font-size="9" fill="#059669">legacy-app 对比 · 4 refs</text>

  <line x1="460" y1="110" x2="485" y2="110" stroke="#3B82F6" stroke-width="2" marker-end="url(#a)"/>
  <text x="472" y="100" font-size="7" fill="#64748B" text-anchor="middle">usecases_json</text>

  <!-- Execution -->
  <rect x="650" y="55" width="120" height="110" rx="10" fill="url(#boxGrad)" stroke="#059669" stroke-width="2" filter="url(#s)"/>
  <rect x="650" y="55" width="120" height="28" rx="10" fill="#059669"/>
  <text x="710" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="white">⚡ execution</text>
  <text x="710" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E293B">测试执行 🔜</text>
  <text x="710" y="120" text-anchor="middle" font-size="10" fill="#64748B">testkit-runner</text>
  <text x="710" y="136" text-anchor="middle" font-size="9" fill="#94A3B8">真机批量测试</text>
  <text x="710" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">占位，待自动化方案</text>

  <line x1="625" y1="110" x2="650" y2="110" stroke="#059669" stroke-width="2" marker-end="url(#a)"/>
  <text x="637" y="100" font-size="7" fill="#047857" text-anchor="middle">覆盖检测+补齐</text>

  <!-- Output -->
  <rect x="795" y="80" width="85" height="55" rx="8" fill="#1E293B" filter="url(#s)"/>
  <text x="837" y="103" text-anchor="middle" font-size="10" fill="#94A3B8">输出</text>
  <text x="837" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="white">测试报告</text>

  <line x1="770" y1="105" x2="795" y2="105" stroke="#3B82F6" stroke-width="2" marker-end="url(#a)"/>

  <!-- Feedback loop -->
  <path d="M 710,170 L 710,290 L 350,290 L 350,168" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#a2)"/>
  <text x="530" y="305" text-anchor="middle" font-size="12" fill="#8B5CF6" font-weight="bold">🔄 反馈闭环</text>
  <text x="530" y="322" text-anchor="middle" font-size="10" fill="#64748B">解析报告 → 校准预期 → 修正文档 · 4 阶段双通道</text>

  <!-- Feedback box -->
  <rect x="175" y="240" width="130" height="65" rx="10" fill="url(#fbGrad)" stroke="#7C3AED" stroke-width="2" filter="url(#s)"/>
  <rect x="175" y="240" width="130" height="28" rx="10" fill="#7C3AED"/>
  <text x="240" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="white">🔄 feedback</text>
  <text x="240" y="282" text-anchor="middle" font-size="10" fill="#4C1D95">usecase-calibrator</text>
  <text x="240" y="298" text-anchor="middle" font-size="9" fill="#7C3AED">双通道：用例+文档</text>

  <!-- Coverage feedback loop -->
  <path d="M 555,170 L 555,240 L 350,240 L 350,305" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="255" text-anchor="middle" font-size="9" fill="#059669">覆盖率不足 → 补充用例</text>

  <!-- Workflow on top -->
  <rect x="175" y="355" width="610" height="26" rx="8" fill="#DC2626" opacity="0.9"/>
  <text x="480" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔀 workflow / full-pipeline — 5 阶段总调度 · 并行 subagent · 同阶段多 API 并行 · API>10 分批 · 审批机制</text>

  <!-- Legend -->
  <rect x="30" y="405" width="840" height="32" rx="6" fill="#F1F5F9"/>
  <text x="50" y="425" font-size="11" fill="#64748B">💡 coverage-analyzer 是 v2 新增亮点：在用例生成和执行之间插入覆盖率检测，逐 API 检查场景覆盖完整性，与 legacy-app intCases 基准对比，自动补齐缺失用例</text>
</svg>