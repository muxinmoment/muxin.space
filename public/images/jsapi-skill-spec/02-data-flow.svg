<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Inter', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F9FF"/><stop offset="100%" stop-color="#E0E7FF"/></linearGradient>
    <linearGradient id="fbGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FAF5FF"/><stop offset="100%" stop-color="#EDE9FE"/></linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B5CF6"/></marker>
  </defs>

  <rect width="900" height="400" fill="#F8FAFC" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">核心数据流：与项目流程完全对齐</text>

  <!-- Input -->
  <rect x="40" y="160" width="130" height="60" rx="10" fill="#1E293B" filter="url(#s)"/>
  <text x="105" y="185" text-anchor="middle" font-size="12" fill="#94A3B8">源码</text>
  <text x="105" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Integration<br/>四端源码</text>

  <!-- Arrow -->
  <line x1="170" y1="190" x2="205" y2="190" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Doc -->
  <rect x="210" y="60" width="140" height="120" rx="10" fill="url(#boxGrad)" stroke="#EA580C" stroke-width="2" filter="url(#s)"/>
  <rect x="210" y="60" width="140" height="30" rx="10" fill="#EA580C"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📋 doc</text>
  <text x="280" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">文档校验</text>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#64748B">doc-validator</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#94A3B8">校验 API 文档合规性</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#94A3B8">输出差异报告</text>

  <!-- Arrow -->
  <line x1="350" y1="120" x2="385" y2="120" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="367" y="108" font-size="9" fill="#64748B" text-anchor="middle">api_docs</text>

  <!-- Usecase -->
  <rect x="390" y="60" width="140" height="120" rx="10" fill="url(#boxGrad)" stroke="#CA8A04" stroke-width="2" filter="url(#s)"/>
  <rect x="390" y="60" width="140" height="30" rx="10" fill="#CA8A04"/>
  <text x="460" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🧪 usecase</text>
  <text x="460" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">用例生成</text>
  <text x="460" y="130" text-anchor="middle" font-size="11" fill="#64748B">usecase-generator</text>
  <text x="460" y="150" text-anchor="middle" font-size="10" fill="#94A3B8">规则模式 · 知识库模式</text>
  <text x="460" y="170" text-anchor="middle" font-size="10" fill="#94A3B8">输出标准化 JSON 用例</text>

  <!-- Arrow -->
  <line x1="530" y1="120" x2="565" y2="120" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="547" y="108" font-size="9" fill="#64748B" text-anchor="middle">api_usecases_json</text>

  <!-- Execution -->
  <rect x="570" y="60" width="140" height="120" rx="10" fill="url(#boxGrad)" stroke="#059669" stroke-width="2" filter="url(#s)"/>
  <rect x="570" y="60" width="140" height="30" rx="10" fill="#059669"/>
  <text x="640" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚡ execution</text>
  <text x="640" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">测试执行</text>
  <text x="640" y="130" text-anchor="middle" font-size="11" fill="#64748B">testkit-runner</text>
  <text x="640" y="150" text-anchor="middle" font-size="10" fill="#94A3B8">真机批量测试</text>
  <text x="640" y="170" text-anchor="middle" font-size="10" fill="#94A3B8">覆盖率统计 · 报告生成</text>

  <!-- Arrow to output -->
  <line x1="710" y1="120" x2="745" y2="120" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="750" y="90" width="110" height="60" rx="10" fill="#1E293B" filter="url(#s)"/>
  <text x="805" y="115" text-anchor="middle" font-size="11" fill="#94A3B8">输出</text>
  <text x="805" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">测试报告</text>

  <!-- Feedback loop -->
  <path d="M 640,185 L 640,290 L 460,290 L 460,185" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#a2)"/>
  <text x="550" y="300" text-anchor="middle" font-size="12" fill="#8B5CF6" font-weight="bold">🔄 反馈闭环</text>
  <text x="550" y="318" text-anchor="middle" font-size="10" fill="#64748B">解析报告 → 校准用例预期 → 修正文档定义</text>

  <!-- Feedback box -->
  <rect x="210" y="240" width="140" height="70" rx="10" fill="url(#fbGrad)" stroke="#7C3AED" stroke-width="2" filter="url(#s)"/>
  <rect x="210" y="240" width="140" height="28" rx="10" fill="#7C3AED"/>
  <text x="280" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔄 feedback</text>
  <text x="280" y="285" text-anchor="middle" font-size="11" fill="#4C1D95">usecase-calibrator</text>
  <text x="280" y="302" text-anchor="middle" font-size="9" fill="#7C3AED">双通道校准：用例+文档</text>

  <!-- Workflow on top -->
  <rect x="210" y="240" width="500" height="30" rx="8" fill="#DC2626" opacity="0.9"/>
  <text x="460" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔀 workflow / full-pipeline — 总调度层，只编排不执行，薄核心重调度</text>

  <!-- Legend -->
  <rect x="40" y="360" width="820" height="30" rx="6" fill="#F1F5F9"/>
  <text x="60" y="380" font-size="11" fill="#64748B">💡 所有分类完全贴合「源码 → 文档 → 用例 → 执行 → 反馈修正」核心链路，认知成本最低</text>
</svg>