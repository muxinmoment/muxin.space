<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Inter', 'PingFang SC', sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="900" height="400" fill="#F8FAFC" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E293B">三个隐喻帮你理解这套架构</text>

  <!-- Metaphor 1 -->
  <rect x="30" y="60" width="830" height="95" rx="10" fill="white" stroke="#E2E8F0" filter="url(#s)"/>
  <circle cx="65" cy="95" r="18" fill="#3B82F6"/>
  <text x="65" y="101" text-anchor="middle" font-size="18" fill="white">🏢</text>
  <text x="95" y="90" font-size="15" font-weight="bold" fill="#1E293B">三级作用域 = 公司工具层级</text>
  <text x="95" y="112" font-size="12" fill="#64748B">L0 全局级 = 公司公共工具（所有部门都能用）</text>
  <text x="95" y="130" font-size="12" fill="#64748B">L1 项目级 = 部门专业工具（测试组内部共享） | L2 包级 = 岗位专属工具（只我用）</text>

  <!-- Metaphor 2 -->
  <rect x="30" y="170" width="830" height="95" rx="10" fill="white" stroke="#E2E8F0" filter="url(#s)"/>
  <circle cx="65" cy="205" r="18" fill="#DC2626"/>
  <text x="65" y="211" text-anchor="middle" font-size="18" fill="white">🏭</text>
  <text x="95" y="200" font-size="15" font-weight="bold" fill="#1E293B">五大流程分类 = 工厂的生产线</text>
  <text x="95" y="222" font-size="12" fill="#64748B">workflow = 车间调度员（只分派任务不动手）</text>
  <text x="95" y="240" font-size="12" fill="#64748B">doc / usecase / execution / feedback = 四道工序（各司其职） → 质检返工通道形成闭环</text>

  <!-- Metaphor 3 -->
  <rect x="30" y="280" width="830" height="95" rx="10" fill="white" stroke="#E2E8F0" filter="url(#s)"/>
  <circle cx="65" cy="315" r="18" fill="#7C3AED"/>
  <text x="65" y="321" text-anchor="middle" font-size="18" fill="white">🎯</text>
  <text x="95" y="310" font-size="15" font-weight="bold" fill="#1E293B">双维度等级管控 = 质量门禁 + 权限沙箱</text>
  <text x="95" y="332" font-size="12" fill="#64748B">P0-P3 成熟度：核心依赖必须 99% 准确率，探索性 Skill 可以随时迭代废弃</text>
  <text x="95" y="350" font-size="12" fill="#64748B">Tier1-Tier4 安全等级：只读分析自动执行，写文件操作需确认，防止 Agent 误操作</text>
</svg>