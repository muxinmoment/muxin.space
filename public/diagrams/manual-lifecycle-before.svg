<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="720" height="340" fill="#fff" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">改前：人工介入只有一个点</text>

  <!-- Box: invoke -->
  <rect x="40" y="60" width="180" height="60" rx="8" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">invoke()</text>
  <text x="130" y="105" text-anchor="middle" font-size="11" fill="#64748b">调用 API</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="90" x2="260" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box: manual (single point) -->
  <rect x="260" y="60" width="180" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">manual</text>
  <text x="350" y="105" text-anchor="middle" font-size="11" fill="#64748b">人工确认</text>

  <!-- Arrow 2 -->
  <line x1="440" y1="90" x2="480" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box: expect -->
  <rect x="480" y="60" width="180" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="570" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">expect</text>
  <text x="570" y="105" text-anchor="middle" font-size="11" fill="#64748b">自动断言</text>

  <!-- Problem section -->
  <rect x="40" y="155" width="640" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="360" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">⚠️ 两个致命问题</text>

  <circle cx="80" cy="205" r="12" fill="#fca5a5"/>
  <text x="80" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="105" y="210" font-size="12" fill="#7f1d1d">前置准备来不及：API 已经调了，人才看到提示去准备环境</text>

  <circle cx="80" cy="232" r="12" fill="#fca5a5"/>
  <text x="80" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="105" y="237" font-size="12" fill="#7f1d1d">死锁：invoke 等 callback → manual 等 invoke → 人等 manual 才操作 → callback 没人触发</text>

  <!-- Deadlock visual -->
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#94a3b8">invoke() 等 callback → manual 等 invoke() → 人等 manual → callback 没人触发 🔁</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
