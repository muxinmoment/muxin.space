<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="780" height="480" fill="#fff" rx="8"/>
  <text x="390" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Harness 的五件事</text>
  <text x="390" y="54" text-anchor="middle" font-size="11" fill="#64748b">模型只做决定，剩下的全靠 harness 接住</text>

  <!-- center hub -->
  <circle cx="390" cy="260" r="58" fill="#1e293b"/>
  <text x="390" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Model</text>
  <text x="390" y="274" text-anchor="middle" font-size="9.5" fill="#cbd5e1">只负责决定</text>

  <!-- 5 spokes -->
  <g>
    <path d="M 390 200 L 390 130" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="290" y="70" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="390" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">① 约束动作空间</text>
    <text x="390" y="110" text-anchor="middle" font-size="9.5" fill="#1e40af">带 schema 的工具，把意图收窄成安全操作</text>
  </g>

  <g>
    <path d="M 442 222 L 500 160" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="500" y="115" width="210" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="605" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">② 管理上下文窗口</text>
    <text x="605" y="155" text-anchor="middle" font-size="9.5" fill="#166534">维护历史，只送"需要的"不是"所有的"</text>
  </g>

  <g>
    <path d="M 448 260 L 510 260" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="510" y="230" width="210" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="615" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">③ 执行 ReAct 循环</text>
    <text x="615" y="270" text-anchor="middle" font-size="9.5" fill="#78350f">调工具→观察→再决定，直到收敛</text>
  </g>

  <g>
    <path d="M 442 298 L 500 360" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="500" y="365" width="210" height="60" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.4"/>
    <text x="605" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">④ 安全护栏</text>
    <text x="605" y="405" text-anchor="middle" font-size="9.5" fill="#991b1b">动作执行前评估授权 / 安全分类器</text>
  </g>

  <g>
    <path d="M 348 298 L 290 360" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="80" y="365" width="210" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="185" y="387" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">⑤ 持久化状态</text>
    <text x="185" y="405" text-anchor="middle" font-size="9.5" fill="#5b21b6">会话 / 调用记录 / 预算，跨轮次留存</text>
  </g>

  <text x="390" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">大部分 agent 工程工作发生在这五格里，不是在 prompt 里</text>
</svg>
