<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="780" height="380" fill="#fff" rx="8"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">同一条时间线，两种场景各自落在不同位置</text>

  <!-- timeline base -->
  <line x1="60" y1="80" x2="720" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="120" cy="80" r="5" fill="#64748b"/>
  <text x="120" y="65" text-anchor="middle" font-size="11" fill="#475569">调用前</text>
  <circle cx="390" cy="80" r="5" fill="#64748b"/>
  <text x="390" y="65" text-anchor="middle" font-size="11" fill="#475569">调用中</text>
  <circle cx="660" cy="80" r="5" fill="#64748b"/>
  <text x="660" y="65" text-anchor="middle" font-size="11" fill="#475569">调用后</text>

  <!-- Scenario 1: QR scan -->
  <text x="60" y="130" font-size="13" font-weight="700" fill="#1e40af">场景一 · 扫码测试</text>
  <rect x="60" y="145" width="120" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="168" text-anchor="middle" font-size="11" fill="#1e40af">preManual</text>
  <text x="120" y="185" text-anchor="middle" font-size="10" fill="#475569">放置二维码</text>
  <line x1="180" y1="172" x2="380" y2="172" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ax)"/>
  <text x="280" y="163" text-anchor="middle" font-size="10" fill="#64748b">准备好了才调 API</text>
  <rect x="390" y="145" width="120" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#64748b">（无需中置）</text>
  <text x="450" y="185" text-anchor="middle" font-size="10" fill="#94a3b8">API 直接扫码</text>

  <!-- Scenario 2: button click -->
  <text x="60" y="240" font-size="13" font-weight="700" fill="#92400e">场景二 · 按钮点击测试</text>
  <rect x="60" y="255" width="120" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="278" text-anchor="middle" font-size="11" fill="#94a3b8">（无需前置）</text>
  <text x="120" y="295" text-anchor="middle" font-size="10" fill="#94a3b8">直接开始监听</text>
  <rect x="330" y="255" width="120" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="278" text-anchor="middle" font-size="11" fill="#92400e">midManual</text>
  <text x="390" y="295" text-anchor="middle" font-size="10" fill="#78350f">人去点按钮</text>
  <line x1="450" y1="282" x2="650" y2="282" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ay)"/>
  <text x="550" y="273" text-anchor="middle" font-size="10" fill="#64748b">点击触发回调完成</text>
  <rect x="600" y="255" width="120" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="660" y="278" text-anchor="middle" font-size="11" fill="#166534">postManual</text>
  <text x="660" y="295" text-anchor="middle" font-size="10" fill="#14532d">确认结果</text>

  <rect x="60" y="330" width="660" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="390" y="354" text-anchor="middle" font-size="11" fill="#475569">同一条时间线，同一套三个位置——不同场景只是用到了不同的位置组合，不需要为每种场景单独设计流程</text>

  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
