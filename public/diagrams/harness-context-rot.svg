<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="780" height="420" fill="#fff" rx="8"/>
  <text x="390" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Context Rot：塞得越多，模型判断力掉得越快</text>

  <!-- axis -->
  <line x1="90" y1="340" x2="700" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="80" x2="90" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="395" y="378" text-anchor="middle" font-size="11" fill="#64748b">塞进上下文的信息量 →</text>
  <text x="60" y="200" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 60 200)">模型判断质量 →</text>

  <!-- curve: naive full context -->
  <path d="M 110 100 C 250 110, 350 180, 460 260 C 540 310, 600 320, 680 322"
        stroke="#dc2626" stroke-width="2.4" fill="none"/>
  <text x="560" y="245" font-size="11" fill="#dc2626" font-weight="700">全量装配</text>
  <text x="560" y="262" font-size="10" fill="#991b1b">噪音越堆越多，质量持续下滑</text>

  <!-- curve: on-demand tool calling -->
  <path d="M 110 150 C 250 140, 400 130, 550 122 C 610 118, 650 116, 680 115"
        stroke="#16a34a" stroke-width="2.4" fill="none"/>
  <text x="420" y="100" font-size="11" fill="#16a34a" font-weight="700">按需 tool calling</text>
  <text x="420" y="117" font-size="10" fill="#166534">只在需要时把干净信息送进来</text>

  <!-- markers -->
  <circle cx="110" cy="100" r="4" fill="#dc2626"/>
  <circle cx="680" cy="322" r="4" fill="#dc2626"/>
  <circle cx="110" cy="150" r="4" fill="#16a34a"/>
  <circle cx="680" cy="115" r="4" fill="#16a34a"/>

  <text x="390" y="400" text-anchor="middle" font-size="10.5" fill="#64748b">harness 的大部分精巧设计 — 压缩、子agent、工具输出治理、按需检索 — 本质都是在管这条曲线</text>
</svg>
