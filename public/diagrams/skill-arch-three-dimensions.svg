<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="780" height="460" fill="#fff" rx="8"/>
  <text x="390" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">三个维度，缺一个都会散架</text>

  <!-- Dimension 1: scope -->
  <rect x="30" y="60" width="220" height="180" rx="10" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">维度一：作用域</text>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#64748b">"谁可以用"</text>
  <rect x="50" y="118" width="180" height="34" rx="6" fill="#bfdbfe"/>
  <text x="140" y="139" text-anchor="middle" font-size="11" fill="#1e3a8a">全局级 · 跨项目通用</text>
  <rect x="50" y="158" width="180" height="34" rx="6" fill="#93c5fd"/>
  <text x="140" y="179" text-anchor="middle" font-size="11" fill="#1e3a8a">项目级 · 本项目专属</text>
  <rect x="50" y="198" width="180" height="34" rx="6" fill="#60a5fa"/>
  <text x="140" y="219" text-anchor="middle" font-size="11" fill="#1e293b">模块级 · 子模块专属</text>

  <!-- Dimension 2: process -->
  <rect x="280" y="60" width="220" height="180" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">维度二：流程分类</text>
  <text x="390" y="106" text-anchor="middle" font-size="11" fill="#64748b">"是干什么的"</text>
  <text x="390" y="128" text-anchor="middle" font-size="11" fill="#78350f">提取信息 → 生成内容 →</text>
  <text x="390" y="145" text-anchor="middle" font-size="11" fill="#78350f">执行任务 → 反馈修正</text>
  <path d="M 310 165 L 470 165" stroke="#d97706" stroke-width="2" marker-end="url(#a1)"/>
  <circle cx="320" cy="165" r="6" fill="#d97706"/>
  <circle cx="365" cy="165" r="6" fill="#d97706"/>
  <circle cx="410" cy="165" r="6" fill="#d97706"/>
  <circle cx="455" cy="165" r="6" fill="#d97706"/>
  <text x="390" y="195" text-anchor="middle" font-size="10" fill="#92400e">按链路天然分类，不是拍脑袋</text>
  <text x="390" y="212" text-anchor="middle" font-size="10" fill="#92400e">拆的</text>

  <!-- Dimension 3: quality/risk -->
  <rect x="530" y="60" width="220" height="180" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="640" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">维度三：双重管控</text>
  <text x="640" y="106" text-anchor="middle" font-size="11" fill="#64748b">"靠不靠谱 / 能不能放手"</text>
  <rect x="550" y="118" width="180" height="34" rx="6" fill="#fca5a5"/>
  <text x="640" y="139" text-anchor="middle" font-size="11" fill="#7f1d1d">成熟度：好不好</text>
  <rect x="550" y="158" width="180" height="34" rx="6" fill="#f87171"/>
  <text x="640" y="179" text-anchor="middle" font-size="11" fill="#fff">安全等级：能不能自主跑</text>
  <text x="640" y="212" text-anchor="middle" font-size="10" fill="#7f1d1d">两个独立指标，不能合并</text>

  <!-- bottom: combined -->
  <rect x="130" y="280" width="520" height="140" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="390" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">三维叠加 = 一个 Skill 的完整坐标</text>
  <text x="390" y="335" text-anchor="middle" font-size="12" fill="#475569">"项目级 · 用例生成分类 · P1 成熟度 · Tier3 监督执行"</text>
  <text x="390" y="358" text-anchor="middle" font-size="11" fill="#64748b">缺一维，就只是"分了分文件"，不是真的架构</text>
  <text x="390" y="380" text-anchor="middle" font-size="11" fill="#64748b">缺三维中的任何一维，管理成本都会在项目变大后反弹回来</text>
  <text x="390" y="400" text-anchor="middle" font-size="10" fill="#94a3b8">就像立方体缺一条边，撑不起体积</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
