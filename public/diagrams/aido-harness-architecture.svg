<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="780" height="560" fill="#fff" rx="8"/>
  <text x="390" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Harness 目标架构：让模型自己决定要什么</text>

  <!-- Harness outer box -->
  <rect x="80" y="55" width="620" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Harness（新增）</text>

  <rect x="105" y="92" width="280" height="86" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="245" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">AgentLoop</text>
  <text x="245" y="130" text-anchor="middle" font-size="10.5" fill="#5b21b6">调模型 → 判 tool_calls</text>
  <text x="245" y="146" text-anchor="middle" font-size="10.5" fill="#5b21b6">→ 执行 tool → 追加结果</text>
  <text x="245" y="162" text-anchor="middle" font-size="10.5" fill="#5b21b6">→ 再调，直到 finish</text>

  <rect x="405" y="92" width="130" height="86" rx="8" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="470" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">ToolRegistry</text>
  <text x="470" y="148" text-anchor="middle" font-size="9.5" fill="#5b21b6">工具注册 / 调度</text>

  <rect x="555" y="92" width="130" height="86" rx="8" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="620" y="130" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">LoopBudget</text>
  <text x="620" y="148" text-anchor="middle" font-size="9.5" fill="#5b21b6">轮次 / 调用数</text>
  <text x="620" y="162" text-anchor="middle" font-size="9.5" fill="#5b21b6">token 硬上限</text>

  <!-- Skills box -->
  <rect x="80" y="230" width="280" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Skills（下沉）</text>
  <text x="220" y="275" text-anchor="middle" font-size="11" fill="#1e40af">planner_skill</text>
  <text x="220" y="294" text-anchor="middle" font-size="11" fill="#64748b">goal_skill · review_skill</text>
  <text x="220" y="313" text-anchor="middle" font-size="11" fill="#64748b">preference_skill</text>
  <text x="220" y="336" text-anchor="middle" font-size="10" fill="#3b82f6">postprocess 保留 714 行防幻觉归一化</text>

  <!-- Tools box -->
  <rect x="420" y="230" width="280" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="560" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Tools（新增）</text>
  <text x="560" y="275" text-anchor="middle" font-size="10.5" fill="#78350f">query_tasks_by_range</text>
  <text x="560" y="292" text-anchor="middle" font-size="10.5" fill="#78350f">query_project_tasks</text>
  <text x="560" y="309" text-anchor="middle" font-size="10.5" fill="#78350f">query_templates</text>
  <text x="560" y="326" text-anchor="middle" font-size="10.5" fill="#78350f">query_long_term_plan · query_preference_memory</text>
  <text x="560" y="346" text-anchor="middle" font-size="9.5" fill="#b45309">反向 HTTP →</text>

  <!-- runtime box -->
  <rect x="130" y="410" width="520" height="70" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="390" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">runtime（扩展）</text>
  <text x="390" y="455" text-anchor="middle" font-size="10.5" fill="#334155">llm_client + tool_calls / tool_call_id 支持（四个 extra=forbid 模型显式改）</text>

  <!-- backend box -->
  <rect x="230" y="500" width="320" height="46" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="390" y="527" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">aido-backend · 细粒度查询接口（JWT 透传）</text>

  <!-- arrows -->
  <path d="M 220 195 L 220 230" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#h1)"/>
  <path d="M 560 195 L 560 230" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#h1)"/>
  <path d="M 220 360 L 220 410" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#h1)"/>
  <path d="M 560 360 L 560 410" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#h1)"/>
  <path d="M 390 480 L 390 500" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#h1)"/>

  <defs>
    <marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
