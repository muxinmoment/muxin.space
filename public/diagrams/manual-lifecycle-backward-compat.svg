<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="760" height="320" fill="#fff" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">新字段默认不触发，老用例一行不用改</text>

  <!-- Old case -->
  <text x="190" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">老用例（不写新字段）</text>
  <rect x="70" y="80" width="240" height="140" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="90" y="105" font-size="11" fill="#166534" font-family="monospace">manual: {...}</text>
  <text x="90" y="128" font-size="11" fill="#94a3b8" font-family="monospace">preManual: 未声明</text>
  <text x="90" y="151" font-size="11" fill="#94a3b8" font-family="monospace">midManual: 未声明</text>
  <line x1="90" y1="165" x2="290" y2="165" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="190" y="188" text-anchor="middle" font-size="11" fill="#166534">→ 引擎跳过新逻辑</text>
  <text x="190" y="206" text-anchor="middle" font-size="11" fill="#166534">行为和改动前完全一致</text>

  <!-- New case -->
  <text x="570" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">新用例（按需声明）</text>
  <rect x="450" y="80" width="240" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="105" font-size="11" fill="#92400e" font-family="monospace">manual: {...}</text>
  <text x="470" y="128" font-size="11" fill="#92400e" font-family="monospace">preManual: {放置二维码}</text>
  <text x="470" y="151" font-size="11" fill="#92400e" font-family="monospace">midManual: {点击按钮}</text>
  <line x1="470" y1="165" x2="670" y2="165" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="570" y="188" text-anchor="middle" font-size="11" fill="#92400e">→ 引擎按声明执行</text>
  <text x="570" y="206" text-anchor="middle" font-size="11" fill="#92400e">只在需要的地方多做一步</text>

  <rect x="150" y="250" width="460" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#475569">同一个引擎，两种用例并存 —— 老字段语义不变一行，</text>
  <text x="380" y="290" text-anchor="middle" font-size="11" fill="#475569">四百多个既有测试全部照常通过</text>
</svg>
