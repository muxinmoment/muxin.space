<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>

  <rect width="780" height="360" fill="#fff" rx="8"/>

  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">同一个测试场景，改前 vs 改后</text>

  <!-- Scenario 1: scanCode -->
  <rect x="20" y="50" width="740" height="130" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="72" font-size="13" font-weight="700" fill="#334155">扫码测试</text>

  <!-- Before -->
  <text x="40" y="95" font-size="11" font-weight="600" fill="#ef4444">改前</text>
  <rect x="80" y="83" width="90" height="25" rx="4" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="125" y="100" text-anchor="middle" font-size="11" fill="#1e40af">调扫码</text>
  <text x="178" y="100" font-size="14" fill="#ef4444">→</text>
  <rect x="195" y="83" width="90" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="100" text-anchor="middle" font-size="11" fill="#92400e">确认结果</text>
  <text x="293" y="100" font-size="14" fill="#ef4444">→</text>
  <text x="310" y="100" font-size="11" fill="#ef4444">❌ 二维码还没放，扫什么？</text>

  <text x="40" y="125" font-size="11" font-weight="600" fill="#22c55e">改后</text>
  <rect x="80" y="113" width="90" height="25" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="125" y="130" text-anchor="middle" font-size="11" fill="#1e40af">放二维码</text>
  <text x="178" y="130" font-size="14" fill="#22c55e">→</text>
  <rect x="195" y="113" width="90" height="25" rx="4" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="240" y="130" text-anchor="middle" font-size="11" fill="#1e40af">调扫码</text>
  <text x="293" y="130" font-size="14" fill="#22c55e">→</text>
  <rect x="310" y="113" width="90" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="355" y="130" text-anchor="middle" font-size="11" fill="#92400e">确认结果</text>
  <text x="410" y="130" font-size="11" fill="#22c55e">✅ 前置 + 后置，两步清晰</text>

  <text x="40" y="160" font-size="11" fill="#64748b">感悟：不是代码写错了，是流程的时序写反了。人的操作时机应该在调用之前，但旧设计只给了调用之后的位置。</text>

  <!-- Scenario 2: setNavigationBarButtons -->
  <rect x="20" y="195" width="740" height="145" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="217" font-size="13" font-weight="700" fill="#334155">设置导航栏按钮测试</text>

  <text x="40" y="240" font-size="11" font-weight="600" fill="#ef4444">改前</text>
  <rect x="80" y="228" width="100" height="25" rx="4" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="130" y="245" text-anchor="middle" font-size="11" fill="#1e40af">设按钮+等回调</text>
  <text x="188" y="245" font-size="14" fill="#ef4444">→</text>
  <rect x="205" y="228" width="90" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="250" y="245" text-anchor="middle" font-size="11" fill="#92400e">确认效果</text>
  <text x="303" y="245" font-size="14" fill="#ef4444">→</text>
  <text x="320" y="245" font-size="11" fill="#ef4444">❌ 死锁：API 等按钮点击，人等提示才点</text>

  <text x="40" y="270" font-size="11" font-weight="600" fill="#22c55e">改后</text>
  <rect x="80" y="258" width="100" height="25" rx="4" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="130" y="275" text-anchor="middle" font-size="11" fill="#1e40af">设按钮(回调监听中)</text>
  <text x="188" y="275" font-size="14" fill="#22c55e">→</text>
  <rect x="205" y="258" width="100" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="255" y="275" text-anchor="middle" font-size="11" fill="#92400e">点击按钮</text>
  <text x="313" y="275" font-size="14" fill="#22c55e">→</text>
  <rect x="330" y="258" width="90" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="375" y="275" text-anchor="middle" font-size="11" fill="#92400e">确认效果</text>
  <text x="428" y="275" font-size="11" fill="#22c55e">✅ 中间插一步：人在回调期间交互</text>

  <text x="40" y="305" font-size="11" fill="#64748b">感悟：死锁不是算法层面的，是时序假设层面的。原来假设"所有操作都能在调用前后完成"，但 callback 型 API 天生需要人在中间做操作。</text>

  <text x="40" y="330" font-size="12" font-weight="600" fill="#3b82f6">⚡ 467 个现有测试全过 | 0 新增 lint | 现有用例零修改</text>
</svg>
