<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>
  <rect width="760" height="320" fill="#fff" rx="8"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">拆开 vs 合并：一个判断标准，两种结果</text>

  <!-- Left: split case (before) -->
  <text x="180" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">拆开的代价</text>
  <rect x="50" y="75" width="120" height="55" rx="8" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="98" text-anchor="middle" font-size="11" fill="#1e40af">提取信息</text>
  <text x="110" y="114" text-anchor="middle" font-size="10" fill="#64748b">Skill A</text>

  <rect x="190" y="75" width="120" height="55" rx="8" fill="#e8f4fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="98" text-anchor="middle" font-size="11" fill="#1e40af">校验规范</text>
  <text x="250" y="114" text-anchor="middle" font-size="10" fill="#64748b">Skill B</text>

  <path d="M 170 102 L 190 102" stroke="#f59e0b" stroke-width="2" marker-end="url(#m1)"/>
  <text x="180" y="145" text-anchor="middle" font-size="10" fill="#d97706">总是先A后B</text>
  <text x="180" y="160" text-anchor="middle" font-size="10" fill="#d97706">中间无独立决策点</text>

  <rect x="50" y="185" width="260" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="180" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">代价</text>
  <text x="180" y="228" text-anchor="middle" font-size="10" fill="#7f1d1d">每次调用多一次上下文切换</text>
  <text x="180" y="245" text-anchor="middle" font-size="10" fill="#7f1d1d">两份文档要保持同步，边界模糊</text>
  <text x="180" y="260" text-anchor="middle" font-size="10" fill="#7f1d1d">→ 应该合并</text>

  <!-- divider -->
  <line x1="390" y1="50" x2="390" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right: independent case -->
  <text x="580" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">保持独立的理由</text>
  <rect x="450" y="75" width="120" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="98" text-anchor="middle" font-size="11" fill="#166534">生成用例</text>
  <text x="510" y="114" text-anchor="middle" font-size="10" fill="#64748b">Skill C</text>

  <rect x="610" y="75" width="120" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="670" y="98" text-anchor="middle" font-size="11" fill="#166534">检测覆盖</text>
  <text x="670" y="114" text-anchor="middle" font-size="10" fill="#64748b">Skill D</text>

  <path d="M 570 102 L 610 102" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="580" y="145" text-anchor="middle" font-size="10" fill="#16a34a">可以单独被调用</text>
  <text x="580" y="160" text-anchor="middle" font-size="10" fill="#16a34a">各自有独立输入输出边界</text>

  <rect x="450" y="185" width="260" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="580" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">收益</text>
  <text x="580" y="228" text-anchor="middle" font-size="10" fill="#14532d">谁需要覆盖率数据，直接调 D</text>
  <text x="580" y="245" text-anchor="middle" font-size="10" fill="#14532d">不必每次都跑一遍生成逻辑</text>
  <text x="580" y="260" text-anchor="middle" font-size="10" fill="#14532d">→ 应该保持独立</text>

  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
